<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPTIC</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#17171a"><link rel="apple-touch-icon" href="icon-192.png">
<script>(()=>{let t;try{t=localStorage.getItem('cv-theme')}catch{}if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';try{localStorage.setItem('cv-theme',t)}catch{}}document.documentElement.dataset.theme=t})()</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317171a'/%3E%3Cpath d='M9 16h14m-5-5 5 5-5 5' stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f7f6f3;--surface:#fff;--ink:#17171a;--mute:#6f6e6a;--line:#e4e2dc;--on:#fff;--warn:#8a5200;--warnbg:#fbf3e2;--err:#b3261e;color-scheme:light}
:root[data-theme=dark]{--bg:#121211;--surface:#1b1b1a;--ink:#f0efeb;--mute:#8d8c86;--line:#2e2d2a;--on:#121211;--warn:#e0b05a;--warnbg:#2a2415;--err:#f2867e;color-scheme:dark}
*,*::before,*::after{transition:background-color .4s ease,color .4s ease,border-color .4s ease,opacity .15s,transform .15s}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:56px 20px;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:520px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
h1{font-size:17px;font-weight:700;letter-spacing:.14em}
.sub{color:var(--mute);font-size:13px;margin-bottom:22px}
.theme{position:relative;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);overflow:hidden}
.theme:hover{border-color:var(--mute)}
.theme svg{position:absolute;inset:0;margin:auto;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .4s ease}
.moon,[data-theme=dark] .sun{transform:rotate(-90deg) scale(.3);opacity:0}
[data-theme=dark] .moon{transform:none;opacity:1}
#locs{margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
#drop{display:block;padding:48px 24px;text-align:center;border-style:dashed;cursor:pointer}
#drop:hover,#drop.over{border-color:var(--ink)}
#drop.over{transform:scale(1.01)}
#drop b{display:block;font-weight:560;font-size:16px;margin-bottom:2px}
#drop small,.hint,#fmeta,.stat{color:var(--mute);font-size:13px}
.file{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.file>div:first-child{min-width:0}
#fname{font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
#clear{border:0;background:none;font-size:22px;line-height:1;color:var(--mute);padding:4px 8px;border-radius:8px}
#clear:hover{color:var(--ink);background:var(--bg)}
.lbl{font-size:12px;color:var(--mute);margin:22px 0 8px;letter-spacing:.04em;text-transform:uppercase}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 13px;font-size:14px;transition:border-color .12s}
.pills button:hover{border-color:var(--mute)}
.pills button.on{background:var(--ink);color:var(--on);border-color:var(--ink)}
.cmp{margin-top:16px;padding:0 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;cursor:pointer}
#cbody{padding:2px 0 16px;display:grid;gap:12px}
input[type=checkbox]{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px #0003}
input[type=checkbox]:checked{background:var(--ink)}
input[type=checkbox]:checked::after{transform:translateX(14px)}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
select:focus,input:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.t{display:flex;gap:8px}.t input{flex:1}
.note{margin-top:14px;padding:10px 13px;border-radius:10px;font-size:13.5px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.note.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.note.err{color:var(--err)}
.primary{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:var(--ink);color:var(--on);font-weight:580;transition:opacity .15s}
.primary:hover{opacity:.88}.primary:disabled{opacity:.4;cursor:default}
#prog{height:3px;background:var(--line);border-radius:3px;margin-top:14px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
#status{font-size:13px;color:var(--mute);margin-top:8px;min-height:20px}
#done{margin-top:24px;padding:16px}
#pv{display:grid;place-items:center;background:var(--bg);border-radius:10px;overflow:hidden;min-height:90px;padding:8px}
#pv img,#pv video{max-width:100%;max-height:320px;border-radius:6px;display:block}
#pv audio{width:100%}
.stat{display:flex;justify-content:space-between;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:560}
#locs .hint{margin-top:8px}
.pl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;line-height:1.4}
.pl video{display:block;width:100%;max-height:62vh;background:#000;object-fit:contain}
.pl audio{display:none}
.bar{padding:10px 14px 12px;display:grid;gap:6px}
.seek,.ctl{display:flex;align-items:center;gap:8px}
.tm{font-size:12px;font-variant-numeric:tabular-nums;color:var(--mute);min-width:34px}
.gap{flex:1}
.ctl button{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;border-radius:8px;color:inherit}
.ctl button:hover{background:var(--bg)}
.ctl button.on{background:var(--ink);color:var(--on)}
.ctl svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctl select{padding:4px 6px;font-size:13px}
.pl input[type=range]{accent-color:var(--ink);flex:1;min-width:0}
.pl .vl{flex:none;width:70px}
.pl.video .bar{position:absolute;inset:auto 0 0;background:linear-gradient(transparent,#000b);color:#fff;transition:opacity .25s}
.pl.video.playing:not(:hover):not(:focus-within) .bar{opacity:0}
.pl.video .tm{color:#ddd}
.pl.video select{background:#0007;color:#fff;border-color:#fff3}
.pl.video input[type=range]{accent-color:#fff}
.pl.video .ctl button:hover{background:#fff2}
.pl.bad::after{content:attr(data-busy);position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;background:#000b;color:#fff;font-size:14px}
.pl.bad::after{content:attr(data-err)}
.pl:fullscreen{border-radius:0;display:grid;place-items:center;background:#000}
.pl:fullscreen video{max-height:100vh;height:100vh}
.ov{display:none;position:absolute;inset:0;place-content:center;justify-items:center;gap:12px;padding:16px;text-align:center;background:#000c;color:#fff;font-size:14px}
.pl.busy .ov{display:grid}
.ov i{display:block;width:min(280px,70%);height:4px;border-radius:4px;background:#fff3;overflow:hidden}
.ov b{display:block;height:100%;width:0;background:#fff;transition:width .2s}
#orig{margin-top:28px}
.oi{display:block;max-width:100%;max-height:70vh;margin:auto;border-radius:10px;border:1px solid var(--line)}
body.viewer{padding:0;display:block}
body.viewer main{display:none}
#vwr{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);overflow:hidden}
#vwr img{display:block;max-width:100vw;max-height:100vh;object-fit:contain}
#vwr .pl.video{border:0;border-radius:0;background:#000;max-width:100vw;max-height:100vh;display:grid}
#vwr .pl.video video{width:auto;height:auto;max-width:100vw;max-height:100vh}
#vwr .pl.audio{width:min(680px,92vw)}
#vwr .pl.audio .bar{gap:16px;padding:24px 28px}
#vwr .pl.audio .ctl button{width:54px;height:54px}
#vwr .pl.audio .ctl svg{width:27px;height:27px}
#vwr .pl.audio .tm{font-size:14px;min-width:42px}
#vwr .pl.audio select{font-size:15px}
.vt{padding:26px 28px 0;font-size:18px;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{margin-top:36px;text-align:center;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<main>
<header><h1>OPTIC</h1><button id="theme" class="theme" aria-label="Toggle light/dark mode" title="Toggle light/dark mode"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></header>
<p class="sub">Offline Player &amp; Transcoder for Images &amp; Clips. Runs on your device, nothing is uploaded.</p>

<label id="drop" class="card"><input id="file" type="file" hidden><b>Drop a file here to convert or view</b><small>or click to browse · images, audio, video</small></label>

<section id="work" hidden>
  <div class="card file"><div><div id="fname"></div><div id="fmeta"></div></div><button id="clear" title="Remove file" aria-label="Remove file">×</button></div>
  <p id="mismatch" class="note" hidden></p>
  <div class="lbl">Convert to</div><div id="fmts" class="pills"></div>
  <div class="card cmp"><label class="row"><span>Compress</span><input type="checkbox" id="cz"></label><div id="cbody" hidden></div></div>
  <p id="warn" class="note warn" hidden></p>
  <div id="locs">
    <div class="lbl">Save to</div><div class="pills" id="locp"></div><p class="hint" id="lochint"></p>
  </div>
  <button id="go" class="primary">Convert</button>
  <div id="prog" hidden><i></i></div><p id="status" role="status"></p>
</section>

<section id="done" class="card" hidden>
  <div id="pv"></div>
  <div class="stat"><span id="sizes"></span><b id="delta"></b></div>
  <button id="save" class="primary">Save file</button>
</section>
<section id="orig" hidden><div class="lbl">Original</div><div id="origp"></div></section>
<footer>Large files are read and processed in small pieces to keep your device responsive.</footer>
</main>

<div id="vwr" hidden></div>
<script>
const $=s=>document.querySelector(s);
const FMT={image:{png:'PNG',jpg:'JPG',webp:'WebP',avif:'AVIF',bmp:'BMP',gif:'GIF',tiff:'TIFF',ico:'ICO'},audio:{mp3:'MP3',wav:'WAV',ogg:'OGG',opus:'Opus',m4a:'M4A',flac:'FLAC',aac:'AAC'},video:{mp4:'MP4',webm:'WebM',mov:'MOV',mkv:'MKV'}};
const MIME={png:'image/png',jpg:'image/jpeg',webp:'image/webp',avif:'image/avif',bmp:'image/bmp',gif:'image/gif',tiff:'image/tiff',ico:'image/x-icon',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/ogg',m4a:'audio/mp4',flac:'audio/flac',aac:'audio/aac',mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',mkv:'video/x-matroska',avi:'video/x-msvideo'};
const LOSSLESS=['wav','flac'];
const RES={image:[0,3840,2560,1920,1280,960,640],video:[0,1080,720,480,360,240],audio:[320,256,192,128,96,64,48,32]};
const fmt=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':b>=1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
const ua=navigator.userAgent,os=/CrOS/.test(ua)?'cros':/Windows/.test(ua)?'win':/Mac/.test(ua)?'mac':'other';
const L2={cros:['Google Drive','Pick Google Drive in the sidebar of the save dialog.'],win:['OneDrive','Pick OneDrive in the sidebar of the save dialog.'],mac:['iCloud Drive','Pick iCloud Drive in the sidebar of the save dialog.'],other:['Choose folder','A save dialog lets you pick any folder.']}[os];
const canEnc=t=>{try{return document.createElement('canvas').toDataURL(t).startsWith('data:'+t)}catch{return false}};
let file,cat,label,ext,blob,mode='a',rv=0,tv=null,tu=1e6,loc='dl',ff,ffLog='';
try{loc=localStorage.getItem('cv-loc')||'dl'}catch{}

/* ---------- file intake ---------- */
async function sniff(f){
  const b=new Uint8Array(await f.slice(0,200).arrayBuffer()),a=(o,t)=>[...t].every((c,i)=>b[o+i]===c.charCodeAt(0));
  if(a(0,'\x89PNG'))return['image','PNG'];
  if(b[0]===255&&b[1]===216)return['image','JPEG'];
  if(a(0,'GIF8'))return['image','GIF'];
  if(a(0,'BM'))return['image','BMP'];
  if(a(0,'II*\0')||a(0,'MM\0*'))return['image','TIFF'];
  if(a(0,'RIFF')){if(a(8,'WEBP'))return['image','WebP'];if(a(8,'WAVE'))return['audio','WAV'];if(a(8,'AVI '))return['video','AVI'];}
  if(a(4,'ftyp')){const br=String.fromCharCode(...b.slice(8,12));
    if(/^avi[fs]/.test(br))return['image','AVIF'];if(/^(heic|heix|mif1)/.test(br))return['image','HEIC'];
    if(/^M4[AB] /.test(br))return['audio','M4A'];return['video',br==='qt  '?'MOV':'MP4']}
  if((b[0]===71&&b[188]===71)||(b[4]===71&&b[196]===71))return['video','MPEG-TS'];
  if(a(0,'\x1aE\xdf\xa3'))return['video','WebM/MKV'];
  if(a(0,'OggS'))return['audio','OGG'];
  if(a(0,'fLaC'))return['audio','FLAC'];
  if(a(0,'ID3')||(b[0]===255&&(b[1]&224)===224))return['audio','MP3'];
  const t=f.type.split('/')[0];return[['image','audio','video'].includes(t)?t:null,(f.name.split('.').pop()||'').toUpperCase()];
}
async function load(f){
  reset();const[c,l]=await sniff(f);
  if(!c){return flash('That file type isn’t supported. Try an image, audio or video file.')}
  file=f;cat=c;label=l;$('#drop').hidden=true;$('#work').hidden=false;
  $('#fname').textContent=f.name;$('#fmeta').textContent=`${fmt(f.size)} · ${l} ${c}`;
  const e=(f.name.split('.').pop()||'').toLowerCase(),n={jpg:'jpeg',tif:'tiff',mkv:'webm/mkv',webm:'webm/mkv',oga:'ogg',m4v:'mp4',qt:'mov'}[e]||e,mm=$('#mismatch');
  mm.hidden=l.toLowerCase().includes(n)||!f.name.includes('.');
  mm.textContent=`This file is named .${e} but its contents are ${l}. Convertify goes by the contents, so converting will produce a genuine file.`;
  const keys=await fmtKeys(c),cur=l.toLowerCase();
  ext=keys.find(k=>!cur.startsWith(k==='jpg'?'jpeg':k))||keys[0];
  $('#fmts').innerHTML=keys.map(k=>`<button data-k="${k}">${FMT[c][k]}</button>`).join('');
  rv=c==='audio'?128:0;tv=null;mode='a';initLocs();markFmt();renderC();showOrig();
}
function flash(m){const w=$('#warn');w.hidden=false;w.className='note err';w.textContent=m;$('#work').hidden=true;$('#drop').hidden=false;$('#warn').after&&$('#drop').after(w)}
function reset(){blob=null;sweep();$('#orig').hidden=true;$('#origp').replaceChildren();$('#done').hidden=true;$('#warn').hidden=true;$('#warn').className='note warn';$('#work').append($('#warn'));$('#work').insertBefore($('#warn'),$('#go'));$('#status').textContent='';$('#prog').hidden=true}
$('#file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
$('#clear').onclick=()=>{reset();file=null;$('#file').value='';$('#work').hidden=true;$('#drop').hidden=false};
const dz=$('#drop');
['dragenter','dragover'].forEach(t=>addEventListener(t,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over')}));
addEventListener('drop',e=>e.dataTransfer.files[0]&&load(e.dataTransfer.files[0]));

/* ---------- format + compression UI ---------- */
function markFmt(){document.querySelectorAll('#fmts button').forEach(b=>b.classList.toggle('on',b.dataset.k===ext));if($('#locp').firstChild)markLoc()}
$('#fmts').onclick=e=>{const k=e.target.dataset.k;if(!k)return;ext=k;markFmt();$('#done').hidden=true;renderC()};
$('#cz').onchange=()=>{$('#cbody').hidden=!$('#cz').checked;renderC()};
function opts(){
  const on=$('#cz').checked&&!(cat==='audio'&&LOSSLESS.includes(ext));
  return{on,mode,res:rv,T:(+($('#tv')?.value??tv)||0)*tu}
}
function renderC(){
  const el=$('#cbody');$('#cbody').hidden=!$('#cz').checked;
  if(cat==='audio'&&LOSSLESS.includes(ext)){el.innerHTML='<p class="hint">Lossless formats can’t be compressed this way. Choose MP3, Opus, AAC, M4A or OGG to reduce size.</p>';return preWarn()}
  if(tv==null){if(file.size>=2e6){tv=+(file.size/2e6).toFixed(1);tu=1e6}else{tv=Math.max(1,Math.round(file.size/2e3));tu=1e3}}
  const lb=v=>cat==='audio'?v+' kbps':!v?'Original size':cat==='video'?v+'p':v+' px, longest side';
  el.innerHTML=`<div class="pills"><button data-m="a" class="${mode==='a'?'on':''}">${cat==='audio'?'Bitrate':'Resolution'}</button><button data-m="t" class="${mode==='t'?'on':''}">Target size</button></div>`+
  (mode==='a'?`<select id="rs">${RES[cat].map(v=>`<option value="${v}"${v===rv?' selected':''}>${lb(v)}</option>`).join('')}</select>`
  :`<div class="t"><input id="tv" type="number" min="1" step="any" value="${tv}"><select id="tu"><option value="1000"${tu===1e3?' selected':''}>KB</option><option value="1000000"${tu===1e6?' selected':''}>MB</option></select></div><p class="hint">Original: ${fmt(file.size)}. Convertify lowers quality and size automatically to get under this.</p>`);
  preWarn();
}
$('#cbody').onclick=e=>{const m=e.target.dataset.m;if(m){mode=m;renderC()}};
$('#cbody').oninput=e=>{if(e.target.id==='rs')rv=+e.target.value;if(e.target.id==='tv')tv=+e.target.value;if(e.target.id==='tu')tu=+e.target.value;preWarn()};
function showWarn(m){const w=$('#warn');w.hidden=!m;w.className='note warn';w.innerHTML=Array.isArray(m)?m.join('<br>'):m||''}
function preWarn(){
  const o=opts(),w=[];
  if(o.on&&o.mode==='t'&&o.T){if(o.T>=file.size)w.push('That target isn’t smaller than the original file.');else if(o.T<file.size*.05)w.push('That’s under 5% of the original size. Expect heavy quality loss, and the target may not be reachable.')}
  if(o.on&&o.mode==='a'&&cat==='audio'&&o.res<=48)w.push('At this bitrate audio will sound muffled and speech may be hard to understand.');
  showWarn(w);
}

/* ---------- engines ---------- */
function setStatus(t){$('#status').textContent=t}
let onProg=null;
function setProg(p){$('#prog i').style.width=Math.min(100,Math.max(0,p*100))+'%';onProg&&onProg(Math.min(1,Math.max(0,p)))}
let MB;
async function loadMB(){
  if(MB)return MB;setStatus('Loading media engine…');
  const U='https://cdn.jsdelivr.net/npm/mediabunny@1.61.3/dist/bundles/mediabunny.';
  try{const s=await(await fetch(U+'cjs')).text(),m={exports:{}},g=new Function('module','exports',s+'\n;return typeof Mediabunny!=="undefined"?Mediabunny:undefined')(m,m.exports);MB=g||m.exports;if(!MB.Input)throw 0}
  catch{try{MB=await import(U+'mjs')}catch{throw Error('Couldn’t load the media engine from the CDN. Check your connection (or any content blocker), then try again.')}}
  return MB;
}
async function fmtKeys(c){
  let k=Object.keys(FMT[c]);
  if(c==='image')return k.filter(x=>x==='webp'||x==='avif'?canEnc(MIME[x]):1);
  if(c==='audio')try{const M=await loadMB(),cd={m4a:'aac',aac:'aac',ogg:'opus',opus:'opus',flac:'flac'},ok=await Promise.all(k.map(x=>cd[x]?M.canEncodeAudio(cd[x]):1));k=k.filter((_,i)=>ok[i])}catch{}
  return k;
}
function abr(o,dur,mn,w,def){
  let kb=o.on&&o.mode==='a'?o.res:def;const T=o.on&&o.mode==='t'?o.T:0;
  if(T&&!dur)w.push('Couldn’t read the audio length, so the target size was ignored.');
  if(T&&dur){kb=Math.min(320,Math.floor(T*8/dur/1000*.97));if(kb<mn){kb=mn;w.push('That size is too small for audio this long. It will come out larger than the target.')}}
  if(kb<48)w.push('Very low bitrate: expect muffled audio that may be hard to understand.');
  return kb;
}
/* Audio + video: WebCodecs via Mediabunny. The input is read in slices and, for big files, the output is streamed straight to disk. */
async function viaMB(file,ext,cat,o,fh){
  const M=await loadMB(),w=[],T=o.on&&o.mode==='t'?o.T:0,res=o.on&&o.mode==='a'?o.res:0,cfg={};
  setStatus('Reading file…');

  if(c==='image'){const i=new Image();i.alt=f.name;i.src=URL.createObjectURL(f);i.onerror=()=>v.textContent='This browser can’t display that image format.';v.append(i)}
  else if(c){const p=mkPlayer(f,c,{auto:1});if(c==='audio'){const h=document.createElement('div');h.className='vt';h.textContent=f.name;p.prepend(h)}v.append(p)}
  else v.textContent='Unsupported file.';
}
if('launchQueue'in window)launchQueue.setConsumer(async l=>{if(l.files&&l.files.length)openViewer(await l.files[0].getFile())});
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
